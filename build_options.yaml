version: 1
mod_prefix: zzz_OneasPort
core_pak: zzz_OneasPort_core_P

# Реальные опции, выявленные в файлах сборки ONEAS STUDIO и localStorage.json.
# Настройки из JsLoader / SAMP (classSelect, classSwitch, alocker, rakNetInfo) не включены (skip).

presets:
  basic:
    label: "Basic (лёгкий)"
    description: "Базовые иконки GPS, оружия, UI-контролы и UI-звуки без тяжёлых 1080p-фонов и HUD-иконок."
    options:
      gps_icons: true
      weapon_icons: true
      ui_sounds: true
      hud_bonus_badge: none
      hud_status_icons: false
      speedometer_bg: false
      loading_screen: none
      auth_bg: none
      css_hud_patches: false
      ui_fonts: false

  maximum:
    label: "Maximum (полный Дорожка A)"
    description: "Все доступные в Дорожке A визуальные и звуковые модули ONEAS."
    options:
      gps_icons: true
      weapon_icons: true
      ui_sounds: false
      hud_bonus_badge: bonus_x2
      hud_status_icons: true
      speedometer_bg: true
      loading_screen: mobilesc0
      auth_bg: bg_auth_0
      css_hud_patches: true
      ui_fonts: false

  custom:
    label: "Custom (пользовательский)"
    description: "Текущие значения из блока options ниже (редактируются вручную или в configurator.html)."
    options: {}

active_preset: maximum

options:
  - id: gps_icons
    name: "GPS-иконки карты"
    type: toggle
    default: true
    available: true
    description: "48 перерисованных иконок карты/GPS (uiresources/images/gps -> Main/images/gps, подогнано под 80x80)."
    variants:
      - value: true
        label: "ONEAS (48 иконок)"
        preview: "work/previews/gps/0.png"
      - value: false
        label: "Оригинал HASSLE"

  - id: weapon_icons
    name: "Иконки оружия HUD"
    type: toggle
    default: true
    available: true
    description: "46 файлов (oneas-img/weapon/1..44,46 -> Main/images/hud; 0.png -> hassle-logo2.png + сезонные hassle-logo-helloween.png / hassle-logo-new-year.png). 45.png помечена no_slot."
    variants:
      - value: true
        label: "ONEAS (43 иконки)"
        preview: "work/previews/weapon/24.png"
      - value: false
        label: "Оригинал HASSLE"

  - id: ui_sounds
    name: "Звуки интерфейса и авто (Cohtml)"
    type: toggle
    default: false
    available: true
    description: "4 звука: инвентарь (open/close), сирена и старт двигателя (uiresources/sounds -> Main/sounds)."
    variants:
      - value: true
        label: "ONEAS (4 файла)"
      - value: false
        label: "Оригинал HASSLE"

  - id: hud_bonus_badge
    name: "Бейдж бонуса HUD"
    type: choice
    default: bonus_x2
    available: true
    description: "Варианты значка бонуса из oneas-img/hud/bonus-{2,3}.png -> Main/assets/278.png (60x48) и Main/assets/373.png (53x46) (масштабирование ~2x)."
    variants:
      - value: none
        label: "Оригинал HASSLE"
      - value: bonus_x2
        label: "Бонус x2 (bonus-2.png)"
        preview: "work/previews/hud/bonus-2.png"
      - value: bonus_x3
        label: "Бонус x3 (bonus-3.png)"
        preview: "work/previews/hud/bonus-3.png"

  - id: hud_status_icons
    name: "Иконки HP и брони HUD"
    type: toggle
    default: true
    available: true
    description: "icon-health.png -> Main/assets/health2.png (72x59) и icon-armour.png -> Main/assets/armour2.png (161x198). Голод/заморозка/онлайн (base64 в Hud.js) отнесены к patch_text."
    variants:
      - value: true
        label: "ONEAS (HP + Armour)"
        preview: "work/previews/hud/icon-health.png"
      - value: false
        label: "Оригинал HASSLE"

  - id: speedometer_bg
    name: "Базовые SVG спидометра (топливо/мойка)"
    type: toggle
    default: true
    available: true
    description: "fuel-bg.svg и wash-bg.svg из oneas-img/speed -> Main/assets. Остальные 6 active/danger SVG — inline SVG/CSS в Hud.js/Hud.css (помечены patch_text в css_hud_patches)."
    variants:
      - value: true
        label: "ONEAS (fuel-bg + wash-bg)"
        preview: "work/previews/speed/fuel-bg.svg"
      - value: false
        label: "Оригинал HASSLE"

  - id: loading_screen
    name: "Фон экрана загрузки (mobilescs.txd)"
    type: choice
    default: mobilesc0
    available: true
    description: "8 экранов 1920x1080 из MobileHud/mobilescs.txd -> LoadingScreen/img/background.2fc2a64f.png (rockstar.png: no_slot)."
    variants:
